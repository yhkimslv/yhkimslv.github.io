<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="title desc">
  <title id="title">An illustrated Braille-to-speech pipeline</title>
  <desc id="desc">Five six-dot Braille cells spell HELLO. Arrows lead from the cells to the readable word HELLO, then to a speech waveform. This is a conceptual illustration, not an inference result.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#244e3b" stroke-opacity=".06"/>
    </pattern>
    <marker id="arrow" markerWidth="6" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1 1l4 3-4 3" fill="none" stroke="#c35d3b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="empty-cell" fill="#dce2d7">
      <circle cx="14" cy="17" r="5"/><circle cx="30" cy="17" r="5"/>
      <circle cx="14" cy="35" r="5"/><circle cx="30" cy="35" r="5"/>
      <circle cx="14" cy="53" r="5"/><circle cx="30" cy="53" r="5"/>
    </g>
  </defs>
  <rect width="800" height="490" fill="#f6f4ed"/>
  <rect width="800" height="490" fill="url(#grid)"/>
  <g fill="#18251e" font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="53" font-size="11" letter-spacing="2.1">BRAILLE RECOGNITION</text>
    <text x="38" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="34">From touch to voice.</text>
    <text x="38" y="126" font-size="13" fill="#647165">A small pattern. A readable word. A spoken connection.</text>

    <text x="40" y="164" font-size="10" letter-spacing="1.4" fill="#244e3b">01 / PATTERN</text>
    <text x="372" y="164" font-size="10" letter-spacing="1.4" fill="#244e3b">02 / TEXT</text>
    <text x="556" y="164" font-size="10" letter-spacing="1.4" fill="#244e3b">03 / SPEECH</text>

    <g fill="#fbfaf5" stroke="#244e3b" stroke-opacity=".17">
      <rect x="38" y="180" width="298" height="162" rx="5"/>
      <rect x="370" y="180" width="150" height="162" rx="5"/>
      <rect x="554" y="180" width="208" height="162" rx="5"/>
    </g>

    <!-- Standard six-dot Braille: H=1,2,5; E=1,5; L=1,2,3; O=1,3,5. -->
    <g stroke="#244e3b" stroke-width="1" stroke-opacity=".36" stroke-dasharray="3 3" fill="none">
      <rect x="59" y="207" width="44" height="70" rx="3"/>
      <rect x="112" y="207" width="44" height="70" rx="3"/>
      <rect x="165" y="207" width="44" height="70" rx="3"/>
      <rect x="218" y="207" width="44" height="70" rx="3"/>
      <rect x="271" y="207" width="44" height="70" rx="3"/>
    </g>
    <g transform="translate(59 207)"><use href="#empty-cell"/><g fill="#244e3b"><circle cx="14" cy="17" r="5"/><circle cx="14" cy="35" r="5"/><circle cx="30" cy="35" r="5"/></g></g>
    <g transform="translate(112 207)"><use href="#empty-cell"/><g fill="#244e3b"><circle cx="14" cy="17" r="5"/><circle cx="30" cy="35" r="5"/></g></g>
    <g transform="translate(165 207)"><use href="#empty-cell"/><g fill="#244e3b"><circle cx="14" cy="17" r="5"/><circle cx="14" cy="35" r="5"/><circle cx="14" cy="53" r="5"/></g></g>
    <g transform="translate(218 207)"><use href="#empty-cell"/><g fill="#244e3b"><circle cx="14" cy="17" r="5"/><circle cx="14" cy="35" r="5"/><circle cx="14" cy="53" r="5"/></g></g>
    <g transform="translate(271 207)"><use href="#empty-cell"/><g fill="#244e3b"><circle cx="14" cy="17" r="5"/><circle cx="14" cy="53" r="5"/><circle cx="30" cy="35" r="5"/></g></g>
    <g font-size="11" text-anchor="middle" fill="#647165">
      <text x="81" y="307">H</text><text x="134" y="307">E</text><text x="187" y="307">L</text><text x="240" y="307">L</text><text x="293" y="307">O</text>
    </g>

    <g stroke="#c35d3b" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M343 250h19"/><path d="M527 250h19"/>
    </g>
    <text x="445" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="30" text-anchor="middle" letter-spacing="1">HELLO</text>
    <text x="445" y="307" font-size="11" text-anchor="middle" fill="#647165">readable language</text>

    <path d="M576 247h164" stroke="#244e3b" stroke-opacity=".14"/>
    <g stroke="#244e3b" stroke-width="4" stroke-linecap="round">
      <path d="M584 242v10M596 232v30M608 217v60M620 234v26M632 203v88M644 222v50M656 237v20M668 216v62M680 226v42M692 238v18M704 229v36M716 236v22M728 243v8"/>
    </g>
    <path d="M632 203v88" stroke="#c35d3b" stroke-width="4" stroke-linecap="round"/>
    <text x="658" y="307" font-size="11" text-anchor="middle" fill="#647165">a word, spoken aloud</text>

    <path d="M38 381h724" stroke="#244e3b" stroke-opacity=".19"/>
    <circle cx="43" cy="412" r="4" fill="#c35d3b"/>
    <text x="56" y="416" font-size="10" letter-spacing="1.2" fill="#244e3b">ILLUSTRATED PIPELINE</text>
    <text x="38" y="445" font-size="12" fill="#647165">Conceptual sequence · Six-dot Braille shown in standard reading order.</text>
  </g>
</svg>
